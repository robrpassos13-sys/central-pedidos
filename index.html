<style>
/* Layout: uma coluna de celular (máx. 560px), cabeçalho fixo com o perfil, abas embaixo, cartões de produto com botões grandes */
:root{
  --bg:#eef2ef; --card:#ffffff; --ink:#17201b; --muted:#5d6b63; --line:#d5ddd8;
  --accent:#1e6b4a; --accent-ink:#ffffff; --accent-soft:#dcebe2;
  --ok:#1e6b4a; --warn:#a35a00; --warn-soft:#fbecd6; --bad:#b3261e; --bad-soft:#f8dedb; --info-soft:#e3e9f4; --info:#2c4a80;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --r:12px; --bar:#1e6b4a; --bar-ink:#ffffff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#163d2b;--bar-ink:#e8eeea}}
:root[data-theme="dark"]{--bar:#163d2b;--bar-ink:#e8eeea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613; --card:#1a211d; --ink:#e8eeea; --muted:#9aa8a0; --line:#2c3630;
  --accent:#5fbf8e; --accent-ink:#0d1a13; --accent-soft:#1f3a2c;
  --ok:#5fbf8e; --warn:#f0a94a; --warn-soft:#3a2a12; --bad:#ff8a80; --bad-soft:#3d1b19; --info-soft:#1d2738; --info:#9db8e8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --card:#1a211d; --ink:#e8eeea; --muted:#9aa8a0; --line:#2c3630;
  --accent:#5fbf8e; --accent-ink:#0d1a13; --accent-soft:#1f3a2c;
  --ok:#5fbf8e; --warn:#f0a94a; --warn-soft:#3a2a12; --bad:#ff8a80; --bad-soft:#3d1b19; --info-soft:#1d2738; --info:#9db8e8;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
header.top .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
header.top h1{font-family:var(--f-disp);font-weight:700;font-size:24px;margin:0;letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:6px 12px;font:700 14px var(--f-body);cursor:pointer;white-space:nowrap}
h2{font-family:var(--f-disp);font-size:26px;margin:8px 0 4px;text-wrap:balance}
h3{font-family:var(--f-disp);font-size:20px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
p.help{color:var(--muted);margin:0 0 12px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.row .nm{font-weight:700;font-size:17px;min-width:0}
.row .sub{color:var(--muted);font-size:14px}
.num{font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:700 24px var(--f-body);cursor:pointer;line-height:1}
.stepper button:active{background:var(--accent-soft)}
.stepper input{width:64px;height:46px;text-align:center;font:700 20px var(--f-body);border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
.stepper input:focus{border-color:var(--accent);outline:none}
.stepper input.empty{border-style:dashed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.c-ok{background:var(--accent-soft);color:var(--ok)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.c-info{background:var(--info-soft);color:var(--info)}
.c-mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font:700 17px var(--f-body);cursor:pointer;width:100%}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.small{min-height:40px;width:auto;font-size:15px;padding:0 14px}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:700 16px var(--f-body);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button.on.ref{background:var(--warn);color:#fff}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
select,input.t{min-height:50px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:400 17px var(--f-body);padding:0 12px;width:100%}
.form{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 15px var(--f-body);cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
nav.tabs button{flex:1;min-width:0;min-height:60px;border:0;background:none;color:var(--muted);font:700 13px var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.sticky-sum{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--card);border-top:1px solid var(--line)}
.sticky-sum .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;gap:10px;align-items:center}
.sticky-sum .t{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.sticky-sum .t b{color:var(--ink);font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.kpi .v{font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px;margin-top:4px}
.big{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.sep-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.sep-cell{border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.sep-cell .l{font-size:12px;color:var(--muted);font-weight:700}
.sep-cell input{width:100%;max-width:70px;height:40px;text-align:center;font:700 18px var(--f-body);border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.sep-cell input.alt{border-color:var(--accent);background:var(--accent-soft)}
.roles{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.roles button{display:flex;align-items:center;gap:14px;text-align:left;min-height:72px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:400 15px var(--f-body)}
.roles button b{display:block;font-family:var(--f-disp);font-size:24px}
.roles button span.d{color:var(--muted)}
.roles .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.roles .ic svg{width:26px;height:26px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));width:max-content;z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.banner{border-radius:var(--r);padding:12px;margin-bottom:12px;font-size:15px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.lot{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center}
.lot .d{font-family:var(--f-disp);font-weight:700;font-size:22px;text-align:center;line-height:1}
.lot .d small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;margin-top:3px}
.stripe-bad{border-left:5px solid var(--bad)}
.stripe-warn{border-left:5px solid var(--warn)}
.stripe-ok{border-left:5px solid var(--ok)}
details.card summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700}
details.card summary::-webkit-details-marker{display:none}
table.mini{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
table.mini td,table.mini th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.mini td.n,table.mini th.n{text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mt{margin-top:12px}
.search{position:relative;margin-bottom:10px}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}}}
.etq{border:2px dashed var(--ink);border-radius:8px;padding:12px;background:var(--card);font-size:15px;display:flex;flex-direction:column;gap:3px}
.etq .en{font-family:var(--f-disp);font-size:24px;font-weight:700;line-height:1.05}
.etq .ev{font-weight:700;font-size:18px}
.scrollchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.scrollchips button{flex:none;min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 15px var(--f-body);cursor:pointer}
.scrollchips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.loc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.loc .kpi{cursor:pointer;text-align:left;font:inherit;color:inherit}
.loc .kpi.on{outline:2.5px solid var(--accent)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.flexsp{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.passos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 6px}
.passos span{display:flex;align-items:center;gap:6px;justify-content:center;padding:8px 4px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);color:var(--muted);font-weight:700;font-size:14px}
.passos span b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--bg);font-size:12px}
.passos span.atual{border-color:var(--accent);color:var(--ink)}.passos span.atual b{background:var(--accent);color:var(--accent-ink)}
.passos span.feito{color:var(--ok)}.passos span.feito b{background:var(--accent-soft);color:var(--ok)}
.bannerbtn{width:100%;text-align:left;border:0;font:inherit;cursor:pointer;display:block}
.apagado{opacity:.55}
.barra{height:8px;background:var(--bg);border-radius:4px;margin-top:6px;overflow:hidden}.barra div{height:100%;border-radius:4px}
.legenda{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:8px}.legenda i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.checkrow{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.checkrow input{width:24px;height:24px;margin-top:2px;flex:none;accent-color:var(--accent)}
.chip.wrap{white-space:normal;border-radius:10px;padding:6px 10px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
input.t.erro{border-color:var(--bad);background:var(--bad-soft)}
</style>

<script>

/* ================= utilidades ================= */

const pad=n=>String(n).padStart(2,'0');
const isoDe=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>isoDe(new Date());
const agora=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};

const addDias=(s,n)=>{const t=new Date(toUTC(s)+n*864e5);return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())};

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{if(v===''||v==null)return null;const n=Number(String(v).trim().replace(',','.'));return isFinite(n)&&n>=0?n:null};
const mes=()=>hoje().slice(0,7);
const mesAnt=()=>{const [y,m]=mes().split('-').map(Number);return m===1?(y-1)+'-12':y+'-'+pad(m-1)};

const ocupado={};async function umaVez(k,fn){if(ocupado[k])return;ocupado[k]=true;try{return await fn()}finally{ocupado[k]=false}}
const I=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON={

 caminhao:I('<path d="M2 6h12v10H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>'),
 hist:I('<path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3M3 4v4h4M12 8v4l3 2"/>'),
 eng:I('<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'),
 inv:I('<path d="M9 4h6v3H9zM7 5H5v16h14V5h-2M9 12l2 2 4-4M9 18h6"/>'),
 receber:I('<path d="M12 3v12M7 10l5 5 5-5M4 17v3h16v-3"/>'),
 painel:I('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
 caixa:I('<path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/>')
};

/* ================= estado ================= */
const S={fase:1,produtos:null,cont:{centro:{},palhoca:{},sj:{}},lotes:[],prod:[],lotesL:[],perdas:{},perdasAnt:{},cons:{},consAnt:{},pedidos:[],invs:[],online:false,ro:false};
let db=null,MODO='claude',USER=null,FIXO=null; // MODO firebase = versão hospedada no GitHub
let perfil=LS.get('perfil',null),nome=LS.get('nome',''),aba=LS.get('aba',{});
let passo=LS.get('passo',{});
let painelLoja=LS.get('pl','todas'),painelDias=LS.get('pd',7),estLocal=LS.get('painel','central'),histSec=LS.get('hist','pedidos'),histLoja=LS.get('hl','todas');
const pend={centro:{},palhoca:{},sj:{}};const flushT={};

/* ================= regras ================= */
const F2=()=>S.fase>=2; // etapa 2 = estoque, validade, perdas e inventário
const P=id=>(S.produtos||[]).find(p=>p.id===id);
const nomeP=id=>(P(id)||{nome:id}).nome, unP=id=>(P(id)||{un:''}).un;
const propria=p=>!!p&&(p.propria!=null?p.propria:p.val!=null); // produção própria: loja informa validade no recebimento
function minLoja(p,loja,modo){const m=p.min&&p.min[loja];if(!m)return null;const v=modo==='reforcado'?m[1]:m[0];return v==null?(modo==='reforcado'?(m[0]??null):null):v}
const rasc=loja=>S.cont[loja]||{};
function item(loja,pid){const c=(rasc(loja).itens||{})[pid]||{};const l=pend[loja][pid]||{};return Object.assign({},c,l)}
const modo=loja=>rasc(loja).modo||'normal';
function sugestao(loja,p){const it=item(loja,p.id);const m=minLoja(p,loja,modo(loja));if(it.tem==null||m==null)return null;return Math.max(0,Math.ceil(m-it.tem))}
function qtdPedido(loja,p){const it=item(loja,p.id);if(it.ped!=null)return it.ped;return sugestao(loja,p)||0}
const itensRevisao=loja=>(S.produtos||[]).filter(p=>qtdPedido(loja,p)>0||item(loja,p.id).ped!=null);
const extrasRasc=loja=>rasc(loja).extras||[];
function contados(loja){const ps=S.produtos||[];return{n:ps.filter(p=>item(loja,p.id).tem!=null).length,tot:ps.length}}
const pedidosDe=loja=>S.pedidos.filter(x=>x.loja===loja);
const aberto=loja=>S.pedidos.find(x=>x.loja===loja&&x.status==='enviado');
const aCaminho=loja=>S.pedidos.filter(x=>x.loja===loja&&x.status==='separado');
const abertos=()=>S.pedidos.filter(x=>x.status==='enviado');
const qEnv=(pd,pid)=>{const i=pd.itens[pid];return i.env!=null?i.env:i.ped};
const qExtra=x=>x.env!=null?x.env:x.qtd;
const STATUS={enviado:['c-warn','Aguardando a central'],separado:['c-info','A caminho'],recebido:['c-ok','Recebido'],cancelado:['c-mute','Cancelado']};
const chipStatus=s=>`<span class="chip ${STATUS[s][0]}">${STATUS[s][1]}</span>`;
const codPed=pd=>(LOJAS.find(l=>l.id===pd.loja)||{sg:''}).sg+' '+br(pd.data)+' '+pd.hora;
const lotesDe=(local,pid)=>(local==='central'?S.lotes:S.lotesL.filter(l=>l.loja===local)).filter(l=>l.resta>0&&(!pid||l.p===pid));
function estoque(local,pid){const h=hoje();let tot=0,venc=0,logo=0,prox=null;for(const l of lotesDe(local,pid)){tot+=l.resta;if(l.vence&&l.vence<h)venc+=l.resta;else{if(l.vence&&dias(h,l.vence)<=2)logo+=l.resta;if(l.vence&&(!prox||l.vence<prox))prox=l.vence}}return{tot:r2(tot),venc:r2(venc),bom:r2(tot-venc),logo:r2(logo),prox}}
const fifo=ls=>ls.slice().sort((a,b)=>(a.vence||'0000')<(b.vence||'0000')?-1:(a.vence||'0000')>(b.vence||'0000')?1:((a.data||'')<(b.data||'')?-1:1));
const vencidosEm=local=>lotesDe(local).filter(l=>l.vence&&l.vence<hoje());
// produção: vem dos pedidos abertos das lojas + mínimo da central (só se o gestor cadastrou)
function necessidade(p){const por={};let tot=0;for(const pd of abertos()){if(pd.itens[p.id]){const q=qEnv(pd,p.id);if(q>0){por[pd.loja]=r2((por[pd.loja]||0)+q);tot=r2(tot+q)}}}const bom=F2()?estoque('central',p.id).bom:r2(S.prod.filter(l=>l.p===p.id&&l.data===hoje()&&l.origem==='Produção').reduce((s,l)=>s+l.qtd,0));const falta=Math.max(0,r2(tot-bom));const sobra=Math.max(0,r2(bom-tot));const repor=F2()&&p.minC!=null?Math.max(0,r2(p.minC-sobra)):0;return{por,tot,bom,falta,repor,produzir:r2(falta+repor)}}
function codigoLote(data){const n=S.prod.filter(l=>l.data===data).length+1;return 'L'+data.slice(8,10)+data.slice(5,7)+'-'+pad(n)}
const perdasRegs=()=>[...Object.entries(S.perdasAnt.reg||{}),...Object.entries(S.perdas.reg||{})].map(([id,r])=>Object.assign({id},r));
const consumoDias=()=>Object.assign({},S.consAnt.d||{},S.cons.d||{});

/* ================= gravação ================= */
function falhou(e){if(e&&e.message==='offline')return;const c=e&&e.code?' ('+e.code+')':'';toast(S.ro?'Este acesso só permite ver. Entre no Claude com o e-mail que o gestor convidou como Editor.':'Não consegui salvar'+c+'. Confira a internet e tente de novo.');try{console.warn('Falha ao salvar',e)}catch(_){}}
async function upsert(path,patch){
  if(!db){toast('Sem conexão com os dados. Nada foi salvo.');throw new Error('offline')}
  const ref=db.doc(path);
  try{await ref.update(patch)}catch(e){if(e&&e.code==='invalid_argument'){const s=await ref.get().catch(()=>({exists:true}));if(!s.exists){await ref.set(patch);return}}throw e} // só a plataforma decide se é somente leitura (S.ro)
}
async function put(path,data){if(!db){toast('Sem conexão com os dados. Nada foi salvo.');throw new Error('offline')}await db.doc(path).set(data)}
function editaLoja(loja,pid,campo,valor){pend[loja][pid]=Object.assign(pend[loja][pid]||{},{[campo]:valor});clearTimeout(flushT[loja]);flushT[loja]=setTimeout(()=>flush(loja),700)}
async function flush(loja){
  clearTimeout(flushT[loja]);const p=pend[loja];const keys=Object.keys(p);if(!keys.length)return;
  const itens={};keys.forEach(k=>itens[k]=Object.assign({},p[k]));
  try{await upsert('contagens/'+loja,{itens,atualizado:hoje()+' '+agora()});keys.forEach(k=>{if(JSON.stringify(pend[loja][k])===JSON.stringify(itens[k]))delete pend[loja][k]})}catch(e){falhou(e)}
}
window.addEventListener('pagehide',()=>LOJAS.forEach(L=>flush(L.id)));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')LOJAS.forEach(L=>flush(L.id))});
async function baixar(local,pid,qtd,{soBons=false,loteId=null}={}){
  const col=local==='central'?'lotes':'lotesLoja';const h=hoje();
  let ls=loteId?lotesDe(local,pid).filter(l=>l.id===loteId):fifo(lotesDe(local,pid));
  if(soBons)ls=ls.filter(l=>!l.vence||l.vence>=h);
  let falta=qtd;const tiradas=[];
  for(const l of ls){if(falta<=0)break;const t=r2(Math.min(l.resta,falta));falta=r2(falta-t);l.resta=r2(l.resta-t);await upsert(col+'/'+l.id,{resta:l.resta});tiradas.push({c:l.codigo||'',v:l.vence||null,d:l.data||null,q:t})}
  return{tiradas,faltou:r2(Math.max(0,falta))};
}
async function registrarPerda(local,pid,qtd,motivo,quem,loteId){
  await baixar(local,pid,qtd,{loteId});
  await upsert('perdas/'+mes(),{reg:{[uid()]:{data:hoje(),p:pid,qtd,motivo,quem:quem||'',local}}});
}

/* ================= interface base ================= */
let toastT;function toast(t){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3000)}
const fechaToast=()=>{const t=$('#toast');if(t)t.hidden=true};
function sheet(html,onClick){const bg=document.createElement('div');bg.className='sheet-bg';bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;bg.addEventListener('click',e=>{if(e.target===bg){bg.remove();return}onClick&&onClick(e,()=>bg.remove())});document.body.appendChild(bg);return bg}
function confirmar(titulo,texto,ok='Confirmar',perigo=false){return new Promise(res=>{const bg=sheet(`<h2>${esc(titulo)}</h2><div>${texto}</div><div class="acts"><button class="btn sec" data-r="0">Voltar</button><button class="btn ${perigo?'bad':''}" data-r="1">${esc(ok)}</button></div>`,(e,close)=>{const r=e.target.closest('[data-r]');if(r){close();res(r.dataset.r==='1')}});bg.addEventListener('click',e=>{if(e.target===bg)res(false)});bg.querySelector('[data-r="1"]').focus()})}
const val=v=>v==null?'':fmt(v);
function stepper(id,v,attrs=''){return `<div class="stepper"><button type="button" data-step="-1" data-for="${id}" aria-label="Menos">−</button><input id="${id}" class="${v==null?'empty':''}" type="text" inputmode="decimal" autocomplete="off" value="${val(v)}" placeholder="?" ${attrs} aria-label="Quantidade"><button type="button" data-step="1" data-for="${id}" aria-label="Mais">+</button></div>`}
function prodSelect(id,sel,filtro){const cats={};(S.produtos||[]).filter(filtro||(()=>true)).forEach(p=>{(cats[p.cat||'Outros']=cats[p.cat||'Outros']||[]).push(p)});return `<select id="${id}"><option value="">Escolha o produto…</option>${Object.keys(cats).map(c=>`<optgroup label="${esc(c)}">${cats[c].map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.nome)} (${esc(p.un)})</option>`).join('')}</optgroup>`).join('')}</select>`}
function byCat(list,fn){const cats=[];const m={};list.forEach(p=>{const c=p.cat||'Outros';if(!m[c]){m[c]=[];cats.push(c)}m[c].push(p)});return cats.map(c=>`<h3>${esc(c)}</h3><div class="list">${m[c].map(fn).join('')}</div>`).join('')}
const vazio=(t,s='')=>`<div class="card empty"><b>${t}</b>${s}</div>`;
function chipVence(v){if(!v)return'<span class="chip c-mute">sem validade</span>';const d=dias(hoje(),v);return d<0?'<span class="chip c-bad">VENCIDO</span>':d===0?'<span class="chip c-warn">Vence hoje</span>':d<=2?`<span class="chip c-warn">Vence em ${d} ${d===1?'dia':'dias'}</span>`:`<span class="chip c-ok">${d} dias</span>`}
const stripe=v=>{if(!v)return'';const d=dias(hoje(),v);return d<0?'stripe-bad':d<=2?'stripe-warn':'stripe-ok'};
const chips=(attr,opts,cur)=>`<div class="scrollchips">${opts.map(([k,t])=>`<button data-${attr}="${k}" class="${String(cur)===String(k)?'on':''}">${t}</button>`).join('')}</div>`;
const barra=(v,max,cor='var(--accent)')=>`<div class="barra"><div style="width:${max?Math.max(2,Math.round(v/max*100)):0}%;background:${cor}"></div></div>`;

 loja:[{id:'pedido',t:'Pedido',i:'pedido'},{id:'receber',t:'Receber',i:'receber'},{id:'lvalid',t:'Validades',i:'relogio',f2:1},{id:'lperdas',t:'Perdas',i:'lixo',f2:1},{id:'lhist',t:'Histórico',i:'hist'}],

 gestor:[{id:'separacao',t:'Pedidos',i:'caminhao'},{id:'painel',t:'Painel',i:'painel'},{id:'estoques',t:'Estoques',i:'caixa',f2:1},{id:'historico',t:'Histórico',i:'hist'},{id:'produtos',t:'Produtos',i:'eng'}]

let deferRender=false,dedoNaTela=false;

function render(){
  const main=$('#main');const ae=document.activeElement;
  if(dedoNaTela&&perfil){deferRender=true;return}
  if(ae&&main.contains(ae)&&(ae.tagName==='INPUT'||ae.tagName==='SELECT')&&!ae.dataset.free){deferRender=true;atualizaLeve();return}
  deferRender=false;
  if(MODO==='firebase'&&!USER){$('#ttl').textContent='Central de Pedidos';$('#whoBtn').hidden=true;$('#tabs').hidden=true;$('#sum').hidden=true;main.innerHTML=telaLogin();return}
  if(!perfil){$('#ttl').textContent='Central de Pedidos';$('#whoBtn').hidden=true;$('#tabs').hidden=true;$('#sum').hidden=true;main.innerHTML=telaPerfil();return}
  $('#whoBtn').hidden=false;
  const lj=perfil.tipo==='loja'?LOJAS.find(l=>l.id===perfil.loja):null;
  $('#ttl').textContent=lj?'Loja '+lj.nome:perfil.tipo==='central'?'Central · Produção':'Gestor';
  $('#whoBtn').textContent=(nome?nome.split(' ')[0]+' · ':'')+'Trocar';
  const ts=tabsDe(perfil.tipo);const a=abaAtual();
  $('#tabs').hidden=false;
  $('#tabsIn').innerHTML=ts.map(t=>`<button data-tab="${t.id}" class="${t.id===a?'on':''}" ${t.id===a?'aria-current="page"':''}>${ICON[t.i]}${t.t}${badge(t.id)}</button>`).join('');
  let h;
  if(S.produtos==null)h=`<div class="empty"><b>Carregando…</b>Buscando produtos e pedidos.</div>`;
  else if(!S.produtos.length&&a!=='produtos')h=vazio('Nenhum produto cadastrado','O gestor carrega o cadastro em Gestor › Produtos.');
  else h=VIEWS[a]();
  if(!S.online&&S.produtos!=null)h=`<div class="banner bad">${MODO==='firebase'?'Sem conexão com o banco de dados. Confira a internet.':'Sem conexão com os dados compartilhados. Abra pelo link da Central de Pedidos, entrando na sua conta.'}</div>`+h;
  else if(S.ro)h=`<div class="banner warn"><b>Este acesso só permite ver.</b> Para lançar pedidos, entre no Claude com o e-mail que o gestor convidou como <b>Editor</b>. Se o link estiver aberto ao público, o gestor precisa desligar o link público no botão Share.</div>`+h;
  main.innerHTML=h;
  $('#sum').hidden=true;
  if(a==='pedido')rodapePedido();
  if(a==='separacao')rodapeSep();
}
function badge(t){if(!S.produtos)return'';let n=0;
  if(t==='validades')n=vencidosEm('central').length;
  if(t==='produzir')n=S.produtos.filter(p=>necessidade(p).produzir>0).length;
  if(t==='receber')n=aCaminho(perfil.loja).length;
  if(t==='lvalid')n=vencidosEm(perfil.loja).length;
  if(t==='separacao')n=abertos().length;
  if(t==='estoques')n=LOCAIS.reduce((s,L)=>s+vencidosEm(L.id).length,0);
  return n?`<span class="badge">${n}</span>`:''}

/* ================= LOJA: pedido em 3 passos ================= */
const passos=n=>`<div class="passos">${['Contar','Revisar','Enviar'].map((t,i)=>`<span class="${i+1<n?'feito':i+1===n?'atual':''}"><b>${i+1}</b>${t}</span>`).join('')}</div>`;
function vPedido(){
  const loja=perfil.loja;const ab=aberto(loja);const cam=aCaminho(loja);
  let topo='';
  if(cam.length)topo+=`<button class="banner warn bannerbtn" data-goto="receber"><b>Entrega a caminho.</b> Quando chegar, toque aqui para conferir e receber.</button>`;
  if(ab){const n=Object.keys(ab.itens).length+(ab.extras||[]).length;
    return topo+`${passos(4)}<h2>Pedido enviado</h2>
    <div class="card"><div class="flexsp"><b>Pedido ${esc(codPed(ab))}</b>${chipStatus(ab.status)}</div><p class="help" style="margin:8px 0 0">${n} itens · por ${esc(ab.por||'')}. A central vai separar. Quando sair, aparece em <b>Receber</b>.</p>
    ${tabelaPedido(ab,false)}
    <div class="mt"><button class="btn sec" data-cancelaped="${ab._id}">Cancelar e corrigir o pedido</button></div></div>`}
  return topo+((passo[loja]||'contar')==='revisar'?vRevisar(loja):vContar(loja));
}
function stContar(loja,p){const it=item(loja,p.id);const m=minLoja(p,loja,modo(loja));const s=sugestao(loja,p);
  return it.tem==null?`<span class="chip c-mute">Falta contar</span>`:m==null?`<span class="chip c-mute">Sem mínimo cadastrado</span>`:s>0?`<span class="chip c-warn">Sugestão: pedir ${fmt(s)}</span>`:`<span class="chip c-ok">Tem o suficiente</span>`}
function vContar(loja){
  const md=modo(loja);
  return `${passos(1)}<h2>Conte o estoque da loja</h2>
  <div class="seg" role="group" aria-label="Tipo de dia"><button data-modo="normal" class="${md==='normal'?'on':''}">Dia normal</button><button data-modo="reforcado" class="ref ${md==='reforcado'?'on':''}">Dia reforçado</button></div>
  <p class="help mt">Digite quanto <b>tem agora na loja</b>. O app compara com o mínimo que o gestor definiu e sugere o pedido. No próximo passo você confere e muda o que quiser.</p>
  ${byCat(S.produtos,p=>{const it=item(loja,p.id);const m=minLoja(p,loja,md);
   return `<div class="card row"><div style="min-width:0"><div class="nm">${esc(p.nome)}</div><div class="sub">${esc(p.un)} · mínimo <b class="num">${fmt(m)}</b></div></div>
   ${stepper('t_'+p.id,it.tem,`data-loja="${loja}" data-pid="${p.id}" data-kind="tem"`)}
   <div style="grid-column:1/-1" data-st="${p.id}">${stContar(loja,p)}</div></div>`})}`;
}
function vRevisar(loja){
  const its=itensRevisao(loja);const ex=extrasRasc(loja);const c=contados(loja);
  return `${passos(2)}<h2>Revise seu pedido</h2>
  <p class="help">Estas são as quantidades que vão para a central. A <b>sugestão</b> é o mínimo menos o que você contou. Mude o número se precisar, ou zere para tirar do pedido.</p>
  ${c.n<c.tot?`<div class="banner warn">Você contou ${c.n} de ${c.tot} produtos. Produto não contado só entra no pedido se você adicionar.</div>`:''}
  ${its.length?`<div class="list">${its.map(p=>{const it=item(loja,p.id);const s=sugestao(loja,p);const q=qtdPedido(loja,p);
   return `<div class="card row ${q>0?'':'apagado'}"><div style="min-width:0"><div class="nm">${esc(p.nome)}</div><div class="sub">${it.tem!=null?`tem ${fmt(it.tem)} · mín. ${fmt(minLoja(p,loja,modo(loja)))} · sugestão <b>${fmt(s??0)}</b>`:'adicionado por você'}${it.ped!=null&&s!=null&&it.ped!==s?' · <b style="color:var(--info)">alterado</b>':''}${q>0?'':' · <b>fora do pedido</b>'}</div></div>${stepper('q_'+p.id,q,`data-loja="${loja}" data-pid="${p.id}" data-kind="ped"`)}</div>`}).join('')}</div>`:vazio('Nenhum item no pedido ainda','Pela contagem, a loja tem o suficiente. Adicione abaixo se precisar de algo.')}
  ${ex.length?`<h3>Fora da lista</h3><div class="list">${ex.map((x,i)=>`<div class="card row"><div style="min-width:0"><div class="nm">${esc(x.nome)}</div><div class="sub">${fmt(x.qtd)} ${esc(x.un)}${x.obs?' · '+esc(x.obs):''}</div></div><button class="btn sec small" data-tiraextra="${i}">Tirar</button></div>`).join('')}</div>`:''}
  <div class="grid2 mt"><button class="btn sec" data-addprod="1">+ Produto da lista</button><button class="btn sec" data-addextra="1">+ Item fora da lista</button></div>`;
}
function rodapePedido(){
  const loja=perfil.loja;if(aberto(loja)){$('#sum').hidden=true;return}
  const ps=passo[loja]||'contar';$('#sum').hidden=false;
  if(ps==='contar'){const c=contados(loja);const n=itensRevisao(loja).filter(p=>qtdPedido(loja,p)>0).length;
    $('#sumIn').innerHTML=`<div class="t">Contados <b class="num">${c.n}/${c.tot}</b> · Sugestão <b class="num">${n}</b> itens</div><button class="btn small" data-passo="revisar">Revisar pedido →</button>`;
    (S.produtos||[]).forEach(p=>{const el=document.querySelector(`[data-st="${p.id}"]`);if(el)el.innerHTML=stContar(loja,p)});
  }else{const n=itensRevisao(loja).filter(p=>qtdPedido(loja,p)>0).length+extrasRasc(loja).length;
    $('#sumIn').innerHTML=`<button class="btn sec small" data-passo="contar">← Contagem</button><div class="t" style="text-align:right"><b class="num">${n}</b> itens</div><button class="btn small" id="enviaPed" ${n&&!S.ro?'':'disabled'}>Enviar pedido</button>`}
}
async function enviarPedido(){
  const loja=perfil.loja;await flush(loja);if(aberto(loja)){toast('Já existe um pedido aguardando a central.');return}
  const its=itensRevisao(loja).filter(p=>qtdPedido(loja,p)>0);const ex=extrasRasc(loja);
  if(!its.length&&!ex.length){toast('O pedido está vazio.');return}
  const ok=await confirmar('Enviar pedido para a central?',`<table class="mini"><tr><th>Produto</th><th class="n">Qtd</th></tr>${its.map(p=>`<tr><td>${esc(p.nome)}</td><td class="n">${fmt(qtdPedido(loja,p))} ${esc(p.un)}</td></tr>`).join('')}${ex.map(x=>`<tr><td>${esc(x.nome)} <span class="chip c-info">fora da lista</span></td><td class="n">${fmt(x.qtd)} ${esc(x.un)}</td></tr>`).join('')}</table>`,'Enviar pedido');
  if(!ok)return;
  try{
    const r=rasc(loja);const itens={};const contagem={};
    for(const p of S.produtos){const it=item(loja,p.id);if(it.tem!=null)contagem[p.id]=it.tem;const q=qtdPedido(loja,p);if(q>0)itens[p.id]={tem:it.tem??null,min:minLoja(p,loja,modo(loja)),sug:sugestao(loja,p),ped:q}}
    const id=hoje()+'_'+agora().replace(':','')+'_'+loja+'_'+uid().slice(-3);
    await put('pedidos/'+id,{loja,data:hoje(),hora:agora(),por:nome,modo:modo(loja),status:'enviado',itens,extras:ex.map(x=>Object.assign({},x)),contagem});
    // consumo = última contagem + o que recebeu depois − contagem de agora
    const saldo=Object.assign({},r.saldo||{}),receb=Object.assign({},r.receb||{}),consumo={};
    for(const [pid,tem] of Object.entries(contagem)){if(saldo[pid]!=null){const c=r2(saldo[pid]+(receb[pid]||0)-tem);if(c>0)consumo[pid]=c}saldo[pid]=tem;receb[pid]=0;
      if(F2()){const tot=estoque(loja,pid).tot;if(tot>tem)await baixar(loja,pid,r2(tot-tem))}}
    if(Object.keys(consumo).length){const ja=((S.cons.d||{})[hoje()]||{})[loja]||{};const soma={};for(const k in consumo)soma[k]=r2((ja[k]||0)+consumo[k]);await upsert('consumo/'+mes(),{d:{[hoje()]:{[loja]:soma}}})}
    pend[loja]={};await put('contagens/'+loja,{modo:modo(loja),itens:{},extras:[],saldo,receb,saldoData:hoje()});
    passo[loja]='contar';LS.set('passo',passo);window.scrollTo(0,0);toast('Pedido enviado para a central.');
  }catch(e){falhou(e)}
}
async function cancelarPedido(id){
  const pd=S.pedidos.find(x=>x._id===id);if(!pd||pd.status!=='enviado'){toast('A central já separou este pedido. Não dá mais para cancelar.');return}
  if(!(await confirmar('Cancelar o pedido?','<p class="help">O pedido volta para revisão com as mesmas quantidades, para você corrigir e enviar de novo.</p>','Cancelar pedido',true)))return;
  try{const itens={};for(const [pid,t] of Object.entries(pd.contagem||{}))itens[pid]={tem:t,ped:0}; /* contado e fora do pedido continua fora */ for(const [pid,i] of Object.entries(pd.itens))itens[pid]=Object.assign(itens[pid]||{},{tem:i.tem,ped:i.ped});
    await upsert('pedidos/'+id,{status:'cancelado'});await upsert('contagens/'+pd.loja,{itens,extras:pd.extras||[]});passo[pd.loja]='revisar';LS.set('passo',passo);toast('Pedido cancelado. Corrija e envie de novo.')}catch(e){falhou(e)}
}
function tabelaPedido(pd,completo){
  const env=pd.envio||{},rec=pd.receb||{};
  const linhas=Object.entries(pd.itens).map(([pid,i])=>{const e=(env.itens||{})[pid];const r=(rec.itens||{})[pid];const dv=r&&e&&r.rec!==e.env;const vm=r&&(r.dts||[]).some(x=>x.vC&&x.vL&&x.vC!==x.vL);
    return `<tr><td>${esc(nomeP(pid))}${vm?`<div class="sub" style="color:var(--bad)">validade diferente: central ${(r.dts||[]).map(x=>br(x.vC)).join(', ')} · etiqueta ${(r.dts||[]).map(x=>br(x.vL)).join(', ')}</div>`:''}${completo&&r&&!vm&&(r.dts||[]).some(x=>x.vL||x.vC)?`<div class="sub">validade ${(r.dts||[]).map(x=>br(x.vL||x.vC)).join(', ')}</div>`:''}</td><td class="n">${fmt(i.ped)}</td><td class="n">${e?fmt(e.env):'—'}</td><td class="n" style="${dv?'color:var(--warn);font-weight:700':''}">${r?fmt(r.rec):'—'}</td></tr>`}).join('');
  const ex=(pd.extras||[]).map((x,k)=>{const e=((env.extras||[])[k]||{});const r=(rec.extras||{})[k];return `<tr><td>${esc(x.nome)} <span class="chip c-info">fora da lista</span>${x.obs?`<div class="sub">${esc(x.obs)}</div>`:''}</td><td class="n">${fmt(x.qtd)}</td><td class="n">${e.env!=null?fmt(e.env):'—'}</td><td class="n">${r!=null?fmt(r):'—'}</td></tr>`}).join('');
  return `<div style="overflow-x:auto"><table class="mini"><tr><th>Produto</th><th class="n">Pediu</th><th class="n">Enviou</th><th class="n">Chegou</th></tr>${linhas}${ex}</table></div>`;
}
function cardPedido(pd,mostraLoja){const n=Object.keys(pd.itens).length+(pd.extras||[]).length;const dv=pd.receb&&Object.keys(pd.receb.diverg||{}).length;const vm=pd.receb&&Object.values(pd.receb.itens||{}).some(r=>(r.dts||[]).some(x=>x.vC&&x.vL&&x.vC!==x.vL));
  return `<details class="card"><summary><span>${mostraLoja?'<b>'+esc(nomeLocal(pd.loja))+'</b> · ':''}${br(pd.data)} ${esc(pd.hora)} · ${n} itens</span><span>${dv?'<span class="chip c-warn">diferença</span> ':''}${vm?'<span class="chip c-bad">validade</span> ':''}${chipStatus(pd.status)}</span></summary>
  <p class="help mt" style="margin-bottom:0">Pedido por ${esc(pd.por||'—')}${pd.modo==='reforcado'?' · dia reforçado':''}${pd.envio?` · saiu ${br(pd.envio.data)} ${esc(pd.envio.hora)} (${esc(pd.envio.por||'')})`:''}${pd.receb?` · recebido ${br(pd.receb.data)} ${esc(pd.receb.hora)} (${esc(pd.receb.por||'')})`:''}</p>${tabelaPedido(pd,true)}</details>`}

/* ================= LOJA: receber (validade obrigatória para produção própria) ================= */
const recQ={};
function porcoes(pd,pid){const e=pd.envio.itens[pid];const por=(e.lotes||[]).map(x=>Object.assign({},x));const com=r2(por.reduce((s,x)=>s+x.q,0));if(e.env>com)por.push({c:'',v:null,d:null,q:r2(e.env-com)});return por}
const chipVal=(vl,x)=>vl&&x&&x.v&&vl!==x.v?`<span class="chip c-bad wrap">Diferente do registro da central (${br(x.v)}). Confira a etiqueta.</span>`:vl?'<span class="chip c-ok">Validade anotada</span>':'';
function vReceber(){
  const loja=perfil.loja;const ps=aCaminho(loja);
  if(!ps.length)return `<h2>Receber entrega</h2><p class="help">Quando a central enviar seu pedido, ele aparece aqui para você conferir.</p>`+vazio('Nenhuma entrega a caminho','Tudo o que chegou já foi conferido.');
  return `<h2>Receber entrega</h2><p class="help">Confira cada item. Se chegou outra quantidade, troque o número.${F2()?' Nos itens de <b>produção própria</b>, olhe a etiqueta e digite a <b>validade</b>.':''}</p>`+ps.map(pd=>{const its=Object.entries(pd.envio.itens).filter(([,e])=>e.env>0);const q=recQ[pd._id]=recQ[pd._id]||{};
   return `<div class="card"><div class="flexsp"><b>Pedido ${esc(codPed(pd))}</b><span class="chip c-info">saiu ${br(pd.envio.data)} ${esc(pd.envio.hora)}</span></div></div>
   <div class="list mt">${its.map(([pid,e])=>{const pr=F2()&&propria(P(pid));const rq=q[pid]||{};const por=porcoes(pd,pid);
    return `<div class="card form"><div class="row"><div style="min-width:0"><div class="nm">${esc(nomeP(pid))}</div><div class="sub">saiu <b class="num">${fmt(e.env)}</b> ${esc(unP(pid))}${pr?' · <b>produção própria</b>':''}</div></div>${stepper('r_'+pd._id+'_'+pid,rq.q??e.env,`data-kind="rec" data-e="${pd._id}" data-pid="${pid}"`)}</div>
    ${pr?por.map((x,k)=>{const vl=(rq.dts||[])[k];return `<label class="f" style="font-weight:700">Validade na etiqueta${por.length>1?` (${fmt(x.q)} ${esc(unP(pid))})`:''}<input class="t" type="date" id="v_${pd._id}_${pid}_${k}" data-recv="${pd._id}|${pid}|${k}" value="${vl||''}"></label><span data-recd="${pd._id}|${pid}|${k}">${chipVal(vl,x)}</span>`}).join(''):''}</div>`}).join('')}
    ${(pd.extras||[]).map((x,k)=>{const e=(pd.envio.extras||[])[k]||{};if(!(e.env>0))return'';const rq=q['x'+k]||{};return `<div class="card row"><div style="min-width:0"><div class="nm">${esc(x.nome)}</div><div class="sub">fora da lista · saiu ${fmt(e.env)} ${esc(x.un)}</div></div>${stepper('rx_'+pd._id+'_'+k,rq.q??e.env,`data-kind="rec" data-e="${pd._id}" data-pid="x${k}"`)}</div>`}).join('')}</div>
   <div class="mt"><button class="btn" data-receber="${pd._id}" ${S.ro?'disabled':''}>Confirmar recebimento</button></div>`}).join('<div class="mt"></div>');
}
async function receber(eid){
  const loja=perfil.loja;const pd=S.pedidos.find(x=>x._id===eid);if(!pd)return;const q=recQ[eid]||{};
  const its=Object.entries(pd.envio.itens).filter(([,e])=>e.env>0);
  for(const [pid,e] of its){if(!F2()||!propria(P(pid))||((q[pid]||{}).q??e.env)===0)continue; // não chegou = não precisa validade
   const por=porcoes(pd,pid);const dts=(q[pid]||{}).dts||[];const k=por.findIndex((x,i)=>!dts[i]);if(k>=0){toast('Falta a validade da etiqueta: '+nomeP(pid)+'.');const el=document.getElementById(`v_${eid}_${pid}_${k}`);if(el){el.scrollIntoView({block:'center'});el.classList.add('erro')}return}}
  const dif=its.map(([pid,e])=>({pid,env:e.env,rec:(q[pid]||{}).q??e.env})).filter(x=>x.rec!==x.env);
  if(dif.length&&!(await confirmar('Chegou diferente',`<p class="help">Estes itens vão ficar registrados com diferença para o gestor:</p><table class="mini"><tr><th>Produto</th><th class="n">Saiu</th><th class="n">Chegou</th></tr>${dif.map(x=>`<tr><td>${esc(nomeP(x.pid))}</td><td class="n">${fmt(x.env)}</td><td class="n">${fmt(x.rec)}</td></tr>`).join('')}</table>`,'Confirmar')))return;
  try{
    const rItens={},diverg={};const receb=Object.assign({},rasc(loja).receb||{});
    for(const [pid,e] of its){
      const rec=(q[pid]||{}).q??e.env;if(rec!==e.env)diverg[pid]={env:e.env,rec};
      const pr=F2()&&propria(P(pid));const por=porcoes(pd,pid);const dts=(q[pid]||{}).dts||[];
      por.forEach((x,k)=>{x.vL=pr?dts[k]:null});
      let resto=rec;const entra=[];
      for(const x of por){if(resto<=0)break;const t=r2(Math.min(x.q,resto));resto=r2(resto-t);entra.push(Object.assign({},x,{q:t}))}
      if(resto>0){if(entra.length)entra[entra.length-1].q=r2(entra[entra.length-1].q+resto);else entra.push({c:'',v:null,d:null,vL:null,q:resto})}
      if(F2())for(const x of entra)if(x.q>0)await put('lotesLoja/'+uid(),{loja,p:pid,codigo:x.c,vence:x.vL||x.v||null,venceCentral:x.v||null,data:x.d,qtd:x.q,resta:x.q,receb:hoje(),pedido:eid});
      rItens[pid]={rec,dts:por.map(x=>({q:x.q,vC:x.v||null,vL:x.vL||null}))};receb[pid]=r2((receb[pid]||0)+rec);
    }
    const rEx={};(pd.extras||[]).forEach((x,k)=>{const e=(pd.envio.extras||[])[k]||{};if(e.env>0)rEx[k]=(q['x'+k]||{}).q??e.env});
    await upsert('pedidos/'+eid,{status:'recebido',receb:{data:hoje(),hora:agora(),por:nome,itens:rItens,extras:rEx,diverg}});
    await upsert('contagens/'+loja,{receb});
    delete recQ[eid];toast('Entrega recebida. Validades registradas.');
  }catch(err){falhou(err)}
}

   <table class="mini"><tr><td>Total pedido pelas lojas</td><td class="n">${fmt(n.tot)}</td></tr><tr><td>${F2()?'Já pronto na central':'Já produzido hoje'}</td><td class="n">− ${fmt(Math.min(n.bom,n.tot))}</td></tr>${n.repor?`<tr><td>Repor mínimo da central (${fmt(p.minC)})</td><td class="n">+ ${fmt(n.repor)}</td></tr>`:''}<tr><td><b>Produzir</b></td><td class="n"><b>${fmt(n.produzir)}</b></td></tr></table>

   <div class="mt"><button class="btn sec small" data-lancar="${p.id}" data-q="${n.produzir}">Lançar produção</button></div></div>`}):`<div class="mt">${vazio(abs.length?'Nada para produzir':'Nenhum pedido das lojas ainda',abs.length?(F2()?'A central já tem pronto o que as lojas pediram.':'Tudo o que as lojas pediram já foi lançado como produzido hoje.'):'A lista aparece quando as lojas enviarem os pedidos do dia.')}</div>`}

  <div class="mt"><button class="btn" id="lancaInv" ${n&&!S.ro?'':'disabled'}>Lançar inventário (${n} contados)</button></div>`;

async function lancarInv(){
  const dif=Object.entries(inv).filter(([,v])=>v!=null).map(([pid,c])=>{const p=P(pid);return p&&{p,c,s:estoque('central',pid).tot}}).filter(Boolean).map(x=>Object.assign(x,{d:r2(x.c-x.s)}));
  if(!(await confirmar('Lançar inventário?',`<p class="help">Sobrou mais que o sistema: entra como lote “Inventário”. Faltou: sai como perda “Ajuste de contagem”.</p><table class="mini"><tr><th>Produto</th><th class="n">Sistema</th><th class="n">Contado</th></tr>${dif.map(x=>`<tr><td>${esc(x.p.nome)}</td><td class="n">${fmt(x.s)}</td><td class="n">${fmt(x.c)}</td></tr>`).join('')}</table>`,'Lançar')))return;
  try{const reg={};
    for(const x of dif){reg[x.p.id]={sis:x.s,cont:x.c};
      if(x.d>0){const dt=invDt[x.p.id]||hoje();await put('lotes/'+uid(),{p:x.p.id,qtd:x.d,resta:x.d,data:dt,vence:x.p.val!=null?addDias(dt,x.p.val):null,quem:nome,origem:'Inventário',codigo:codigoLote(dt),criado:new Date().toISOString()})}
      else if(x.d<0)await registrarPerda('central',x.p.id,-x.d,'Ajuste de contagem',nome)}
    await put('inventarios/'+hoje()+'_'+agora().replace(':','')+'_'+uid().slice(-3),{data:hoje(),quem:nome,itens:reg});
    inv={};invDt={};LS.set('inv',inv);LS.set('invdt',invDt);toast('Inventário lançado.');render();
  }catch(e){falhou(e)}
}

/* ================= GESTOR: pedidos e separação ================= */
function vSep(){
  const abs=abertos();
  const status=LOJAS.map(L=>{const a=aberto(L.id);const cam=aCaminho(L.id).length;return `<div class="kpi"><div class="l"><b>${L.nome}</b></div><div class="v">${a?Object.keys(a.itens).length+(a.extras||[]).length:'—'}</div><div class="l">${a?`<span class="chip c-warn">pediu ${esc(a.hora)}</span>`:'sem pedido aberto'}${cam?'<br><span class="chip c-info">a caminho</span>':''}</div></div>`}).join('');
  const pids=[...new Set(abs.flatMap(pd=>Object.keys(pd.itens)))];const ps=S.produtos.filter(p=>pids.includes(p.id));
  return `<h2>Pedidos para separar</h2><p class="help">Pedidos que as lojas enviaram. O número de cada loja é o que vai sair; troque se quiser mandar outra quantidade.</p>
  <div class="kpis">${status}</div>
  ${ps.length?byCat(ps,p=>{const n=necessidade(p);const falta=r2(n.tot-n.bom);const prox=fifo(lotesDe('central',p.id).filter(l=>!l.vence||l.vence>=hoje()))[0];
    return `<div class="card ${falta>0?'stripe-bad':'stripe-ok'}"><div class="row"><div style="min-width:0"><div class="nm">${esc(p.nome)}</div><div class="sub">${esc(p.un)}${F2()?` · central tem <b class="num">${fmt(n.bom)}</b>`:` · produzido hoje <b class="num">${fmt(n.bom)}</b>`}${F2()&&prox&&prox.codigo?` · pegar <span class="code">${esc(prox.codigo)}</span> (vence ${br(prox.vence)})`:''}</div></div><div style="text-align:right"><div class="big">${fmt(n.tot)}</div><div class="sub">separar</div></div></div>
    <div class="sep-grid">${LOJAS.map(L=>{const a=aberto(L.id);const i=a&&a.itens[p.id];if(!i)return `<div class="sep-cell" style="opacity:.45"><span class="l">${L.nome}</span><span class="sub">—</span></div>`;return `<div class="sep-cell"><span class="l">${L.nome}</span><span class="sub">pediu ${fmt(i.ped)}</span><input inputmode="decimal" autocomplete="off" id="e_${L.id}_${p.id}" data-env="${a._id}" data-pid="${p.id}" class="${i.env!=null?'alt':''}" value="${fmt(qEnv(a,p.id))}" aria-label="Enviar ${L.nome}"></div>`}).join('')}</div>
    ${falta>0?`<div class="mt"><span class="chip ${F2()?'c-bad':'c-warn'}">${F2()?'FALTA '+fmt(falta)+' – produzir':'Ainda falta produzir '+fmt(falta)}</span></div>`:''}</div>`}):''}
  ${abs.some(pd=>(pd.extras||[]).length)?`<h3>Fora da lista</h3><div class="list">${abs.flatMap(pd=>(pd.extras||[]).map((x,k)=>`<div class="card row"><div style="min-width:0"><div class="nm">${esc(x.nome)}</div><div class="sub">${esc(nomeLocal(pd.loja))} pediu ${fmt(x.qtd)} ${esc(x.un)}${x.obs?' · '+esc(x.obs):''}</div></div><div class="sep-cell" style="border:0;padding:0"><span class="l">enviar</span><input inputmode="decimal" autocomplete="off" id="x_${pd._id}_${k}" data-envx="${pd._id}|${k}" value="${fmt(qExtra(x))}" aria-label="Enviar"></div></div>`)).join('')}</div>`:''}
  ${!abs.length?`<div class="mt">${vazio('Nenhum pedido aberto','Quando as lojas enviarem os pedidos, eles aparecem aqui.')}</div>`:''}`;
}
function rodapeSep(){const n=abertos().length;$('#sum').hidden=false;$('#sumIn').innerHTML=`<div class="t">Pedidos abertos <b class="num">${n}</b></div><button class="btn small" id="despachar" ${n&&!S.ro?'':'disabled'}>Registrar envio</button>`}
async function despachar(){
  const abs=abertos();if(!abs.length)return;
  const pids=[...new Set(abs.flatMap(pd=>Object.keys(pd.itens)))];
  const ok=await confirmar('Registrar envio?',`<p class="help">Tira do estoque da central (pelo lote que vence antes) e manda os pedidos para as lojas conferirem em <b>Receber</b>.</p><div style="overflow-x:auto"><table class="mini"><tr><th>Produto</th>${LOJAS.map(L=>`<th class="n">${L.nome}</th>`).join('')}</tr>${pids.map(pid=>`<tr><td>${esc(nomeP(pid))}</td>${LOJAS.map(L=>{const a=aberto(L.id);return `<td class="n">${a&&a.itens[pid]?fmt(qEnv(a,pid)):''}</td>`}).join('')}</tr>`).join('')}</table></div>`,'Registrar envio');
  if(!ok)return;
  let lease;try{lease=await db.doc('travas/envio').acquire({holder:uid(),ttlMs:60000})}catch(e){lease={acquired:true}}
  if(!lease.acquired){toast('Outro envio está sendo registrado agora. Aguarde um minuto.');return}
  try{
    const envios={};abs.forEach(pd=>envios[pd._id]={data:hoje(),hora:agora(),por:nome,itens:{},extras:(pd.extras||[]).map(x=>({env:qExtra(x)}))});
    for(const pid of pids){
      const tot=r2(abs.reduce((s,pd)=>s+(pd.itens[pid]?qEnv(pd,pid):0),0));
      const {tiradas}=tot>0&&F2()?await baixar('central',pid,tot,{soBons:true}):{tiradas:[]};const fila=tiradas.map(x=>Object.assign({},x));
      for(const pd of abs){if(!pd.itens[pid])continue;let q=qEnv(pd,pid);const ls=[];while(q>0&&fila.length){const x=fila[0];const t=r2(Math.min(x.q,q));ls.push(Object.assign({},x,{q:t}));x.q=r2(x.q-t);q=r2(q-t);if(x.q<=0)fila.shift()}envios[pd._id].itens[pid]={env:qEnv(pd,pid),lotes:ls}}
    }
    for(const pd of abs)await upsert('pedidos/'+pd._id,{status:'separado',envio:envios[pd._id]});
    toast('Envio registrado. As lojas já podem receber.');
  }catch(e){toast('A conexão falhou no meio do envio. Confira o Histórico antes de tentar de novo.')}
}

/* ================= GESTOR: painel ================= */
function vPainel(){
  const ini=addDias(hoje(),-(painelDias-1));const sel=painelLoja==='todas'?LOJAS.map(l=>l.id):[painelLoja];
  const peds=S.pedidos.filter(x=>x.data>=ini&&x.status!=='cancelado');const regs=F2()?perdasRegs().filter(r=>r.data>=ini):[];const cd=consumoDias();
  const cards=LOJAS.map(L=>{const pd=peds.filter(x=>x.loja===L.id);let pedido=0,enviado=0;pd.forEach(x=>{if(!x.envio)return;Object.entries(x.itens).forEach(([pid,i])=>{pedido+=i.ped;enviado+=((x.envio.itens||{})[pid]||{}).env||0})});
    const at=pedido?Math.round(Math.min(enviado,pedido)/pedido*100):null;const pr=regs.filter(r=>r.local===L.id).length;const vc=vencidosEm(L.id).length;const dv=pd.filter(x=>x.receb&&Object.keys(x.receb.diverg||{}).length).length;const vm=pd.filter(x=>x.receb&&Object.values(x.receb.itens||{}).some(r=>(r.dts||[]).some(d=>d.vC&&d.vL&&d.vC!==d.vL))).length;
    const ruim=(v)=>v?'color:var(--bad);font-weight:700':'';
    return `<div class="card"><div class="flexsp"><b>${L.nome}</b>${aberto(L.id)?'<span class="chip c-warn">pedido aberto</span>':''}${aCaminho(L.id).length?'<span class="chip c-info">entrega a caminho</span>':''}</div>
    <table class="mini"><tr><td>Pedidos no período</td><td class="n">${pd.length}</td></tr><tr><td>Atendimento (enviado ÷ pedido)</td><td class="n">${at==null?'—':at+'%'}</td></tr>${F2()?`<tr><td>Perdas lançadas</td><td class="n" style="${ruim(pr)}">${pr}</td></tr><tr><td>Vencidos na loja agora</td><td class="n" style="${ruim(vc)}">${vc}</td></tr>`:`<tr><td>Itens pedidos fora da lista</td><td class="n">${pd.reduce((s,x)=>s+(x.extras||[]).length,0)}</td></tr>`}<tr><td>Entregas com diferença</td><td class="n" style="${ruim(dv)}">${dv}</td></tr>${F2()?`<tr><td>Validade diferente da central</td><td class="n" style="${ruim(vm)}">${vm}</td></tr>`:''}</table></div>`}).join('');
  const cons={},perd={};
  Object.entries(cd).forEach(([d,o])=>{if(d<ini)return;sel.forEach(l=>Object.entries(o[l]||{}).forEach(([pid,q])=>cons[pid]=r2((cons[pid]||0)+q)))});
  regs.filter(r=>sel.includes(r.local)).forEach(r=>perd[r.p]=r2((perd[r.p]||0)+r.qtd));
  const ids=[...new Set([...Object.keys(cons),...Object.keys(perd)])].sort((a,b)=>((cons[b]||0)+(perd[b]||0))-((cons[a]||0)+(perd[a]||0)));
  const mx=Math.max(1,...ids.map(i=>Math.max(cons[i]||0,perd[i]||0)));
  const porMot={};regs.filter(r=>sel.includes(r.local)).forEach(r=>porMot[r.motivo]=(porMot[r.motivo]||0)+1);
  return `<h2>Painel das lojas</h2>
  ${chips('pdias',[[7,'Últimos 7 dias'],[30,'Últimos 30 dias']],painelDias)}
  <div class="list">${cards}</div>
  <h3>${F2()?'Consumo e perdas por produto':'Consumo por produto'}</h3>
  ${chips('ploja',[['todas','Todas as lojas'],...LOJAS.map(l=>[l.id,l.nome])],painelLoja)}
  <p class="help">Consumo = última contagem + o que chegou − contagem nova. Aparece a partir da 2ª contagem de cada loja.</p>
  <div class="legenda"><span><i style="background:var(--accent)"></i>consumo</span><span><i style="background:var(--bad)"></i>perda</span></div>
  ${ids.length?`<div class="list">${ids.map(pid=>{const c=cons[pid]||0,pe=perd[pid]||0;const pc=c+pe?Math.round(pe/(c+pe)*100):0;
   return `<div class="card"><div class="flexsp"><b>${esc(nomeP(pid))}</b>${pe?`<span class="chip ${pc>=10?'c-bad':'c-warn'}">${pc}% vira perda</span>`:''}</div><div class="flexsp sub"><span>Consumo <b class="num" style="color:var(--ink)">${fmt(c)}</b> ${esc(unP(pid))} · média ${fmt(c/painelDias)}/dia</span><span>Perda <b class="num" style="color:${pe?'var(--bad)':'var(--ink)'}">${fmt(pe)}</b></span></div>${barra(c,mx)}${pe?barra(pe,mx,'var(--bad)'):''}</div>`}).join('')}</div>`:vazio('Ainda sem dados de consumo','Os números aparecem depois que as lojas fizerem pelo menos dois pedidos com contagem.')}
  ${Object.keys(porMot).length?`<h3>Perdas por motivo</h3><div class="card"><div class="chips">${Object.entries(porMot).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`<span class="chip c-mute">${esc(m)}: <b class="num">${n}</b></span>`).join('')}</div></div>`:''}`;
}

/* ================= GESTOR: histórico ================= */
function vHist(){const ops=[['pedidos','Pedidos'],['lanc','Produção lançada'],...(F2()?[['producao','Produção × perda'],['inventarios','Inventários']]:[])];if(!ops.some(o=>o[0]===histSec))histSec='pedidos';return `<h2>Histórico</h2>${chips('hist',ops,histSec)}`+({pedidos:hPedidos,lanc:hLanc,producao:hProducao,inventarios:hInv}[histSec]||hPedidos)()}

function hProducao(){

/* ---- versão GitHub: Firebase (login por unidade + Firestore) ---- */
function bancoFirebase(fs){
  const snap=s=>({id:s.id,exists:s.exists,data:()=>s.data(),metadata:{}});
  const erro=e=>({code:e&&e.code==='permission-denied'?'sem_permissao':(e&&e.code)||'unavailable',message:e&&e.message});
  function doc(path){const ref=fs.doc(path);return{id:ref.id,path,
    get:async()=>snap(await ref.get()),
    set:async d=>{try{await ref.set(d)}catch(e){throw erro(e)}},
    update:async d=>{let s;try{s=await ref.get()}catch(e){throw erro(e)}if(!s.exists)throw{code:'invalid_argument',message:'documento não existe'};try{await ref.set(d,{merge:true})}catch(e){throw erro(e)}}, // mesclagem profunda, como no Claude
    delete:async()=>{try{await ref.delete()}catch(e){throw erro(e)}},
    onSnapshot:(n,e)=>ref.onSnapshot(s=>n(snap(s)),x=>e&&e(erro(x))),
    acquire:async({holder,ttlMs})=>{const agoraMs=Date.now();return fs.runTransaction(async tx=>{const s=await tx.get(ref);const d=s.exists?s.data():{};if(d.exp&&d.exp>agoraMs&&d.holder!==holder)return{acquired:false};tx.set(ref,{holder,exp:agoraMs+(ttlMs||30000)});return{acquired:true}})}}}
  function q(base){return{where:(f,o,v)=>q(base.where(f,o,v)),orderBy:(f,d)=>q(base.orderBy(f,d||'asc')),limit:n=>q(base.limit(n)),
    get:async()=>{const s=await base.get();return{docs:s.docs.map(snap),size:s.size,empty:s.empty}},
    onSnapshot:(n,e)=>base.onSnapshot(s=>n({docs:s.docs.map(snap),size:s.size,empty:s.empty}),x=>e&&e(erro(x)))}}
  return{doc,collection:p=>Object.assign(q(fs.collection(p)),{path:p,doc:id=>doc(p+'/'+id)})};
}
let assinado=false;
function iniciarFirebase(){
  MODO='firebase';
  if(String(window.FIREBASE_CONFIG.apiKey||'').startsWith('COLE')){S.produtos=[];render();return}
  firebase.initializeApp(window.FIREBASE_CONFIG);const fs=firebase.firestore();
  try{fs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{}); // funciona com internet instável
  db=bancoFirebase(fs);
  firebase.auth().onAuthStateChanged(u=>{USER=u;
    if(u){const pre=String(u.email||'').split('@')[0].toLowerCase();FIXO=PERFIL_EMAIL[pre]||null;
      if(FIXO&&FIXO!=='gestor'&&perfil&&(perfil.tipo+(perfil.loja?':'+perfil.loja:''))!==FIXO){perfil=null;LS.set('perfil',null)}
      S.online=true;if(!assinado){assinado=true;assinar()}}
    render()});
}
function assinar(){
  const err=e=>{if(e&&e.code==='revoked'){S.online=false;render()}};const ok=()=>render();
  db.doc('config/sistema').onSnapshot(s=>{S.fase=(s.exists&&s.data().fase)||1;ok()},err);
  db.doc('config/produtos').onSnapshot(s=>{S.produtos=s.exists?(s.data().itens||[]):[];ok()},err);
  LOJAS.forEach(L=>db.doc('contagens/'+L.id).onSnapshot(s=>{S.cont[L.id]=s.exists?s.data():{};ok()},err));
  db.collection('lotes').where('resta','>',0).onSnapshot(s=>{S.lotes=s.docs.map(d=>Object.assign({id:d.id},d.data()));ok()},err);
  db.collection('lotes').where('data','>=',janela()).onSnapshot(s=>{S.prod=s.docs.map(d=>Object.assign({id:d.id},d.data()));ok()},err);
  db.collection('lotesLoja').where('resta','>',0).onSnapshot(s=>{S.lotesL=s.docs.map(d=>Object.assign({id:d.id},d.data()));ok()},err);
  db.doc('perdas/'+mes()).onSnapshot(s=>{S.perdas=s.exists?s.data():{};ok()},err);
  db.doc('perdas/'+mesAnt()).onSnapshot(s=>{S.perdasAnt=s.exists?s.data():{};ok()},err);
  db.doc('consumo/'+mes()).onSnapshot(s=>{S.cons=s.exists?s.data():{};ok()},err);
  db.doc('consumo/'+mesAnt()).onSnapshot(s=>{S.consAnt=s.exists?s.data():{};ok()},err);
  db.collection('pedidos').where('data','>=',addDias(hoje(),-30)).onSnapshot(s=>{S.pedidos=s.docs.map(d=>Object.assign({_id:d.id},d.data())).sort((a,b)=>(b.data+b.hora+b._id)<(a.data+a.hora+a._id)?-1:1);ok()},err);
  db.collection('inventarios').orderBy('data','desc').limit(10).onSnapshot(s=>{S.invs=s.docs.map(d=>d.data());ok()},err);
}
setTimeout(()=>{if(S.produtos==null){S.produtos=[];render()}},11000);
iniciar();
})();
